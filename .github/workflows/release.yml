name: Release Windows app

# Builds ONE file, Buddo-Setup.exe, and puts only that file on the Releases page.
# Every push to main releases the next version by itself (v1.0.0 → v1.0.1), and the desktop app updates itself
# to it. Put [skip release] in a commit message to skip one. A tag that starts with "v", or running it from the
# Actions tab with a tag, releases exactly that version (use it for v1.1.0, v2.0.0…).
# The tests already ran in CI on the commit being released, so this only builds.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        if: env.TAG == ''
        run: |
          # A push to main: the newest vX.Y.Z release, one patch higher.
          latest=$(gh release list --limit 50 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // "v1.0.0"')
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "TAG=v$major.$minor.$((patch + 1))" >> "$GITHUB_ENV"
          echo "Releasing v$major.$minor.$((patch + 1)) (after $latest)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - name: Build Buddo-Setup.exe
        working-directory: apps/desktop
        run: |
          # The app's version is the tag's (v1.2.0 → 1.2.0): the built-in updater compares it with the latest release.
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm install
          npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the installer is complete
        run: |
          ls -la apps/desktop/release
          size=$(stat -c%s apps/desktop/release/Buddo-Setup.exe)
          echo "Buddo-Setup.exe is $size bytes"
          # The app alone is well over 100 MB: a tiny file means something was left out.
          [ "$size" -gt 50000000 ] || { echo "The installer is too small, something is missing."; exit 1; }
      - name: Put only the .exe on the Releases page
        run: |
          cat > notes.md <<'EOF'
          ## Download

          **Buddo-Setup.exe**: double-click it. Buddo installs in a few seconds and opens. No account, no API keys.

          Windows may say "Windows protected your PC" because the app isn't code-signed yet. Click **More info**, then **Run anyway**.

          Buddo runs free AI models on your own computer. On first start it walks you through picking one.

          Mac and Linux: run Buddo from source (see the README).
          EOF
          EXE=apps/desktop/release/Buddo-Setup.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --clobber
          else
            gh release create "$TAG" "$EXE" --title "Buddo $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
          # Nothing but the .exe, even if an older run attached other files.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            [ "$asset" = "Buddo-Setup.exe" ] || gh release delete-asset "$TAG" "$asset" --yes
          done
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
