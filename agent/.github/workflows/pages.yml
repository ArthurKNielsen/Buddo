name: Deploy Buddo Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the edit engine
        run: node --test test/*.test.js
      - name: Preinstall the phone model into the site
        run: python3 scripts/fetch_models.py Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC
      - name: Leave out files the site doesn't need
        run: rm -rf test scripts .github package.json package-lock.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
