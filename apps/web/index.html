<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddo — free local AI coding agent</title>
    <meta name="description" content="Buddo is a free, private AI coding agent that runs on your own machine. No API keys, no subscriptions." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('buddo-store') || '{}').state || {};
        var t = (s.settings && s.settings.theme) || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (s.settings && s.settings.accent) document.documentElement.dataset.accent = s.settings.accent;
      } catch (e) {}
    </script>
    <script>
      // Multi-core CPU mode: register coi-sw.js (adds the isolation headers), then reload once so it applies.
      // Only on browsers with COEP "credentialless" (Chrome, Edge, ChromeOS), where nothing else breaks.
      (function () {
        if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return;
        if (!('credentialless' in HTMLIFrameElement.prototype)) return;
        navigator.serviceWorker.register('%BASE_URL%coi-sw.js').then(function (reg) {
          var key = 'buddo-coi-reloaded';
          try {
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, '1');
          } catch (e) {
            return;
          }
          if (navigator.serviceWorker.controller) location.reload();
          else navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
