<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddo — free local AI coding agent</title>
    <meta name="description" content="Buddo is a free, private AI coding agent that runs on your own machine. No API keys, no subscriptions." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('buddo-store') || '{}').state || {};
        var t = (s.settings && s.settings.theme) || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (s.settings && s.settings.accent) document.documentElement.dataset.accent = s.settings.accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
