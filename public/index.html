<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#6c4cf1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Buddo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Buddo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">B</span> Buddo</div>
    <div class="meter" title="Tokens used in the context window">
      <div class="meter-bar"><div id="meter-fill"></div></div>
      <span id="meter-text">0 / 20,000 tokens</span>
    </div>
    <button id="new-chat" class="ghost">New chat</button>
  </header>

  <main id="chat">
    <section id="empty" class="empty">
      <h1>Hey, I'm Buddo 👋</h1>
      <p>Ask me to write some Python and I'll cook it up.</p>
      <div class="suggestions">
        <button>Write a Python script that renames every file in a folder to lowercase</button>
        <button>Make a simple number guessing game in Python</button>
        <button>Explain list comprehensions with examples</button>
      </div>
    </section>
    <div id="messages"></div>
  </main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message Buddo…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Send">➤</button>
  </form>

  <dialog id="password-dialog">
    <form method="dialog" id="password-form">
      <h2>Enter password</h2>
      <p>This Buddo is locked so only you can use it.</p>
      <input id="password-input" type="password" autocomplete="current-password" required />
      <button type="submit">Unlock</button>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
