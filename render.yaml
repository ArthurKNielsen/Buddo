# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: buddo
    runtime: node
    plan: free
    branch: buddo-from-scratch
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks you for it; it never goes in the repo
      - key: BUDDO_PASSWORD
        sync: false
